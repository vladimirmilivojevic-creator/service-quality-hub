# The free API instance sleeps after 15 minutes without traffic.
# During working hours in Austria (weekdays, about 07:00-20:00) a light ping keeps the live demo
# fast for visitors. Outside those hours it sleeps to stay within the free limits.
# /health does not touch the database, so the database can sleep.
name: Keep demo awake

on:
  schedule:
    - cron: "*/5 6-18 * * 1-5" # every 5 minutes, 06:00-18:59 UTC, Monday-Friday
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping API health endpoint
        run: curl --silent --show-error --max-time 90 --retry 2 "${{ vars.API_URL }}/health"
