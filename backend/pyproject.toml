[project]
name = "service-quality-hub-api"
version = "1.0.0"
requires-python = ">=3.12"
# Same pins as requirements.txt (Docker and CI install that file; Vercel reads this list).
dependencies = [
    "fastapi==0.163.1",
    "uvicorn[standard]==0.54.0",
    "sqlalchemy[asyncio]==2.0.57",
    "asyncpg==0.32.0",
    "aiosqlite==0.22.1",
    "alembic==1.20.1",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.3",
    "python-multipart==0.0.34",
    "pyjwt==2.15.1",
    "bcrypt==5.0.0",
    "pandas==3.1.1",
    "openpyxl==3.1.5",
    "tzdata==2026.6",
]

[tool.vercel]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=85"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.coverage.run]
concurrency = ["greenlet", "thread"]  # SQLAlchemy async runs on greenlets
